# Exemple de vhost Nginx pour servir dist/ (build Astro en mode "directory").
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vitet.info;

    root /var/www/vitet.info/dist;
    index index.html;

    # ssl_certificate     /etc/letsencrypt/live/vitet.info/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/vitet.info/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Ressources empreintées : cache long.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /pagefind/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}

server {
    listen 80;
    listen [::]:80;
    server_name vitet.info;
    return 301 https://$host$request_uri;
}
