<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Panneau de gare japonais indiquant Tokyo">
  <rect width="1600" height="900" fill="#e9e6df"/>
  <g transform="translate(200 180)">
    <rect x="0" y="0" width="1200" height="540" rx="14" fill="#ffffff" stroke="#1f2328" stroke-width="10"/>
    <text x="600" y="150" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="88" font-weight="700" fill="#1f2328">とうきょう</text>
    <text x="600" y="300" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="150" font-weight="800" fill="#1f2328">東 京</text>
    <text x="600" y="380" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="8" fill="#1f2328">TOKYO</text>
    <rect x="0" y="440" width="1200" height="100" fill="#2e8b57"/>
    <rect x="0" y="440" width="1200" height="100" fill="none" stroke="#1f2328" stroke-width="10"/>
    <circle cx="600" cy="490" r="26" fill="#ffffff" stroke="#1f2328" stroke-width="8"/>
    <line x1="60" y1="490" x2="560" y2="490" stroke="#ffffff" stroke-width="10"/>
    <line x1="640" y1="490" x2="1140" y2="490" stroke="#ffffff" stroke-width="10"/>
    <text x="150" y="505" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="40" font-weight="700" fill="#ffffff">◀ 有楽町</text>
    <text x="1050" y="505" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="40" font-weight="700" fill="#ffffff">神田 ▶</text>
  </g>
  <g fill="#1f2328" opacity="0.15">
    <rect x="0" y="820" width="1600" height="80"/>
    <rect x="0" y="0" width="1600" height="40"/>
  </g>
</svg>
